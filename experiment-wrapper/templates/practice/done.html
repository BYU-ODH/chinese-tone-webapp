{% extends "base.html" %}
{% load static %}
{% block title %}Great job — {{ site_name }}{% endblock %}

{% block content %}
<h1 class="page__title">Lesson {{ lesson.number }} Practice</h1>

<div style="display:grid;place-items:center;gap:32px;margin-top:140px;text-align:center">
  <p style="font-family:var(--font-display);font-size:64px;font-weight:700;margin:0">Great Job!</p>
  <p style="font-size:32px;margin:0">You've finished today's lesson:</p>
  <p style="font-size:32px;font-weight:500;margin:0">{{ lesson.title }}</p>

  <div class="coinline" style="margin-top:16px">
    <span>You Earned :</span>
    <img src="{% static 'img/coin-gold.svg' %}" alt="gold coins"><span>{{ gold }}</span>
    <img src="{% static 'img/coin-silver.svg' %}" alt="silver coins"><span>{{ silver }}</span>
  </div>

  <a class="btn btn--lg" style="margin-top:24px" href="{% url 'session_summary' session.id %}">
    See Summary
  </a>
</div>
{% endblock %}
